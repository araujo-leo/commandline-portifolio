<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal - Sobre Mim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="container">
        <h3 class="text-light">Terminal - Linguagem Leonard</h3>
        <div class="terminal" id="terminal">
            <div>Bem-vindo ao terminal da linguagem Leonard. Digite <b>help</b> para ver os comandos disponíveis.</div>
        </div>
        <div class="input-line mt-2">
            <span class="prompt">[user@debian]$</span>
            <input type="text" id="command-input" autofocus>
        </div>

    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
